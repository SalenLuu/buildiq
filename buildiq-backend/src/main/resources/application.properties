spring.application.name=buildiq-backend

# --- Conexión a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:inventario_obra}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
# Evita consultas perezosas fuera de la transacción; cada servicio carga lo que necesita.
spring.jpa.open-in-view=false
# Muestra en la consola el SQL que genera Hibernate (útil para entender qué hace cada operación).
spring.jpa.show-sql=true

# --- Errores en JSON ---
# Para que el frontend reciba { "message": "..." } con el motivo del error.
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
