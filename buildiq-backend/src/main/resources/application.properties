spring.application.name=buildiq-backend

# Conexión a MySQL. Usuario y clave salen de variables de entorno (backend.secrets).
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:inventario_obra}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate solo revisa que las clases coincidan con las tablas; no las modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Muestra en consola el SQL que se ejecuta.
spring.jpa.show-sql=true

# Incluye el mensaje del error en la respuesta, sin el stacktrace.
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
